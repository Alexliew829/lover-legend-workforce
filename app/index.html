<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payroll System - Lover Legend Workforce ERP</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" href="../assets/icons/payroll-system.ico?v=5.3" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png?v=5.3" />
  <link rel="stylesheet" href="../css/style.css?v=5.3" />
</head>
<body>
  <div class="app">
    <header class="header brand-header">
      <img class="header-logo header-logo-left" src="../assets/lover-legend-green.png" alt="Lover Legend Logo" />
      <div class="header-brand-text">
        <div class="brand brand-teal">Lover Legend</div>
        <div class="title brand-red">Workforce ERP</div>
        <div class="version">V5.3 Enterprise Stable</div>
      </div>
      <img class="header-logo header-logo-right" src="../assets/lover-legend-red.jpg" alt="Lover Legend Seal" />
    </header>

    <section class="home-system-status" aria-label="系统状态">
      <button id="homeSystemState" class="home-system-state is-checking" type="button" aria-expanded="false">
        <span id="homeSystemDot" class="home-system-dot"></span><span id="homeSystemText">系统状态</span>
      </button>
      <button id="homeSystemCheckBtn" class="home-system-check" type="button">重新检查</button>
    </section>
    <div id="homeSystemDetails" class="home-system-details" hidden></div>

    <main class="menu home-menu-after-status">
      <a class="menu-card" href="worker.html">
        <div class="icon">👷</div><div><h2>工人管理</h2><p>新增、修改、查看工人资料</p></div>
      </a>
      <a class="menu-card" href="advance.html">
        <div class="icon">💰</div><div><h2>欠款管理</h2><p>记录支粮、准证及欠款资料</p></div>
      </a>
      <a class="menu-card" href="payroll.html">
        <div class="icon">💵</div><div><h2>Payroll / 打印工资单 / Print Payslip</h2><p>每月出粮、扣款计算与打印工资单</p></div>
      </a>
      <a class="menu-card" href="dashboard.html">
        <div class="icon">📊</div><div><h2>Dashboard</h2><p>查看总薪资、总欠款、工人人数</p></div>
      </a>
    </main>
  </div>
  <script src="../js/config.js?v=5.3"></script>
  <script src="../js/api.js?v=5.3"></script>
  <script src="../js/app.js?v=5.3"></script>
</body>
</html>
